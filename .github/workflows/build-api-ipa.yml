name: Build API Integrated IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show available schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme JVZTXNX \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ATH-IPA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/ATH-IPA.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          /usr/bin/zip -qry ATH-IPA-API-integrated-unsigned.ipa Payload
          test -s ATH-IPA-API-integrated-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ATH-IPA-API-integrated-unsigned
          path: build/ATH-IPA-API-integrated-unsigned.ipa
          retention-days: 7
